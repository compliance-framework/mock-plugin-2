# Shared previews from compliance-framework/workflows (tracking main until v1 is tagged): :pr-<number> on
# PRs labelled `preview`; nothing on main (on-main: false).
name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # A merged PR's events carry the base branch as github.ref, so key PR runs by number.
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@21aaac7c174aaf90abafecf1c90c30b238367d3d # v1.3.1
    with:
      kind: go-plugin
      on-main: false
      protocol-version: "1"
    permissions:
      contents: read
      packages: write
