# Shared previews from compliance-framework/workflows (tracking main until v1 is tagged): :pr-<number> on
# PRs labelled `preview`; nothing on main (on-main: false).
name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@0820491954d2f748fed5601109a8b6e422deee69 # v1.1.0
    with:
      kind: go-plugin
      on-main: false
      protocol-version: "1"
    permissions:
      contents: read
      packages: write
