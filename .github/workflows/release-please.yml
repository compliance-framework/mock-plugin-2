# Shared release-please from compliance-framework/workflows (pinned to a commit SHA): opens the
# release PR and, once it merges, tags the release and creates the GitHub release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@ra/w1-s1-t05b-repo-settings-workflow
    permissions:
      contents: read
    secrets: inherit
