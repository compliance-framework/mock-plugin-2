# Shared release-please from compliance-framework/workflows (tracking main until v1 is tagged): opens the
# release PR and, once it merges, tags the release and creates the GitHub release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      contents: read
    secrets: inherit
