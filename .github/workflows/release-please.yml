# Shared release-please from compliance-framework/workflows (tracking main until v1 is tagged): opens the
# release PR and, once it merges, tags the release and creates the GitHub release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    permissions:
      contents: read
    secrets: inherit
