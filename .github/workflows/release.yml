# Shared plugin release from compliance-framework/workflows (tracking main until v1 is tagged): goreleaser
# archives on the GitHub release, then gooci upload to ghcr.io. mock-plugin-2 is a legacy
# protocol v1 plugin, so the OCI annotation must say 1.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    with:
      protocol-version: "1"
    permissions:
      contents: write
      packages: write
    secrets: inherit
