# Shared plugin release from compliance-framework/workflows (tracking main until v1 is tagged): goreleaser
# archives on the GitHub release, then gooci upload to ghcr.io. mock-plugin-2 is a legacy
# protocol v1 plugin, so the OCI annotation must say 1.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    with:
      protocol-version: "1"
    permissions:
      contents: write
      packages: write
    secrets: inherit
